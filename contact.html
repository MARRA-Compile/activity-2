<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact and student feedback page with interactive form input controls.">
    <title>Contact Us - Team Web Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

    <header>
        <h1>Web Systems & Technology Team Project</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact & Student Feedback</h1>

        <form action="#" method="POST">
            <!-- 1. Single-line Text Input -->
            <p>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required>
            </p>

            <!-- 2. Email Input -->
            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <!-- 3. Password Field -->
            <p>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required>
            </p>

            <!-- 4. Grouped Radio Buttons -->
            <fieldset>
                <legend>User Role Selection:</legend>
                <input type="radio" id="student" name="role" value="student" checked>
                <label for="student">Student</label><br>
                <input type="radio" id="instructor" name="role" value="instructor">
                <label for="instructor">Instructor</label><br>
                <input type="radio" id="visitor" name="role" value="visitor">
                <label for="visitor">Visitor</label>
            </fieldset>

            <!-- 5. Independent Checkboxes -->
            <fieldset>
                <legend>Interest Selection:</legend>
                <input type="checkbox" id="frontend" name="interest" value="frontend">
                <label for="frontend">Frontend Development</label><br>
                <input type="checkbox" id="backend" name="interest" value="backend">
                <label for="backend">Backend Development</label><br>
                <input type="checkbox" id="design" name="interest" value="design">
                <label for="design">UI/UX Design</label>
            </fieldset>

            <!-- 6. Multi-line Text Box -->
            <p>
                <label for="message">Your Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="40"></textarea>
            </p>

            <!-- 7. Dropdown Selector -->
            <p>
                <label for="subject">Subject Category:</label><br>
                <select id="subject" name="subject">
                    <option value="general">General Inquiry</option>
                    <option value="feedback">Project Feedback</option>
                    <option value="support">Technical Support</option>
                </select>
            </p>

            <!-- 8. Submit & Reset Buttons -->
            <p>
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Web Systems & Technology Team. All rights reserved. Built by Team Lead & Members.</p>
    </footer>

</body>
</html>
